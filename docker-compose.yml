services:
  postgres:
    image: postgres:16
    container_name: minidoodle-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-minidoodle}
      POSTGRES_USER: ${DB_USER:-minidoodle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-minidoodle}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
